name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install pinned mpv runtime
        shell: pwsh
        run: choco install mpvio.install --version 0.41.0 -y --no-progress

      - name: Build installer and update packages
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\build\release.ps1 -Version $version

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: releases/${{ github.ref_name }}.md
          files: artifacts/releases/*
